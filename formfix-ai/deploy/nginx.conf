server {
  listen 80;
  client_max_body_size 11m;
  access_log off;
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 180s;
  }
  location = /health { proxy_pass http://api:3000/ready; }
  location / { default_type text/plain; return 200 "FormFix AI backend. Mount the existing frontend here and use relative /api URLs.\n"; }
}
