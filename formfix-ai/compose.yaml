services:
  mongo:
    image: mongo:7.0.24
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["mongo:/data/db"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 20
  document:
    build:
      context: .
      dockerfile: services/document/Dockerfile
    environment:
      DOCUMENT_SERVICE_TOKEN: ${DOCUMENT_SERVICE_TOKEN:?Set DOCUMENT_SERVICE_TOKEN in .env}
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/formfix?replicaSet=rs0
      DOCUMENT_SERVICE_URL: http://document:8000
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: "true"
    volumes: ["uploads:/data/uploads"]
    networks: [internal,egress]
    depends_on:
      mongo: {condition: service_healthy}
      document: {condition: service_healthy}
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/formfix?replicaSet=rs0
      DOCUMENT_SERVICE_URL: http://document:8000
      UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]
    networks: [internal,egress]
    depends_on:
      mongo: {condition: service_healthy}
      document: {condition: service_healthy}
    stop_grace_period: 180s
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.mjs"]
      interval: 30s
      timeout: 5s
      retries: 6
  proxy:
    image: nginx:1.28.0-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [internal,egress]
    depends_on:
      api: {condition: service_healthy}
networks:
  internal: {internal: true}
  egress: {}
volumes:
  mongo: {}
  uploads: {}
